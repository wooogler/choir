<!doctype html>
<html lang="en">
  <head>
    <title>Poster — Example Corp</title>
    <meta property="og:title" content="Autumn release poster" />
    <style>body { margin: 0; }</style>
  </head>
  <body>
    <nav><a href="/"><img src="/img/logo.png" alt="" /></a></nav>
    <div class="sheet">
      <img src="poster.png" alt="Autumn release poster" />
    </div>
    <form action="/subscribe"><input name="email" /></form>
    <footer><img src="/img/wordmark.png" alt="" /></footer>
    <script>document.querySelector('.sheet').classList.add('ready');</script>
  </body>
</html>
